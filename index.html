a{color:inherit}
p{margin:0}
h1,h2,h3,h4{font-family:var(--sans);font-weight:300;line-height:1.12;margin:0;letter-spacing:-.005em}
h1.display{font-size:clamp(2.6rem,6.4vw,5.8rem);letter-spacing:-.018em;font-weight:300}
h1.page-title{font-size:clamp(2.4rem,5vw,4.4rem);letter-spacing:-.015em}
h2{font-size:clamp(1.85rem,3.5vw,3rem)}
h3{font-size:1.3rem;font-weight:400;letter-spacing:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--bg);color:var(--ink);padding:.6em 1em;border:1px solid var(--ink)}
.skip:focus{top:calc(12px + env(safe-area-inset-top,0px))}
.wrap{max-width:1360px;margin-inline:auto;padding-inline:clamp(20px,4vw,56px)}
.section{padding-block:clamp(64px,9vw,128px)}
.serif{font-family:var(--serif)}
.lead{font-family:var(--serif);font-size:clamp(1.2rem,1.7vw,1.5rem);line-height:1.55;color:var(--ink)}
.prose{font-family:var(--serif);font-size:1.15rem;line-height:1.7;color:var(--ink)}
.prose p+p{margin-top:1.1em}
.muted{color:var(--ink-2)}

/* ---------- Header ---------- */
.site-header{position:fixed;top:0;left:0;right:0;z-index:50;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) var(--gutter) 0;display:flex;align-items:center;justify-content:space-between;gap:24px;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);transition:background .35s,color .35s,border-color .35s}
.site-header.over-hero{background:transparent;color:#fff;border-bottom-color:transparent}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
.logo-mark{width:48px;height:48px;flex:none}
.logo-bar{width:2px;height:42px;background:var(--logo-ar)}
.logo-word{display:flex;flex-direction:column;font:700 1.28rem/1.02 'Montserrat','Century Gothic','Avenir Next',var(--sans);letter-spacing:.3em;margin-right:-.3em}
.logo-word span:first-child{color:var(--logo-ar)}
.logo-word span:last-child{background:linear-gradient(90deg,#016e82 0%,#01a6bd 70%,#01b8d2 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-tag{display:block;margin-top:10px;font:500 .56rem/1.6 'Montserrat',var(--sans);letter-spacing:.26em;text-transform:uppercase;white-space:nowrap}
.logo.full{align-items:flex-start;gap:18px}
.logo.full .logo-mark{width:64px;height:64px}
.logo.full .logo-word{font-size:1.9rem}
.logo.full .logo-bar{height:64px}
.site-header.over-hero .logo-mark,.on-dark .logo-mark{filter:brightness(0) invert(1)}
.site-header.over-hero .logo,.on-dark .logo,.nav-open .logo{--logo-ar:#fff}
.site-header.over-hero .logo-word span:last-child,.on-dark .logo-word span:last-child,.nav-open .logo-word span:last-child{background-image:linear-gradient(90deg,#7fe0ec,#c4f4f9)}
.nav{display:flex;align-items:center;gap:clamp(20px,2.6vw,40px)}
.nav a{font:400 1rem/1 var(--sans);letter-spacing:.03em;text-decoration:none;padding:10px 0;border-bottom:1px solid transparent;transition:border-color .2s}
.nav a:hover{border-bottom-color:currentColor}
.nav a[aria-current="page"]{border-bottom-color:var(--blue)}
.nav a.nav-cta{border:1px solid currentColor;padding:12px 22px}
.nav a.nav-cta:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.site-header.over-hero .nav a.nav-cta:hover{background:#fff;color:var(--night);border-color:#fff}
.burger{display:none;width:48px;height:48px;background:none;border:0;color:inherit;cursor:pointer;position:relative}
.burger span{position:absolute;left:12px;right:12px;height:1.5px;background:currentColor;transition:transform .3s,top .3s}
.burger span:nth-child(1){top:19px}.burger span:nth-child(2){top:28px}
.nav-open .burger span:nth-child(1){top:23px;transform:rotate(45deg)}
.nav-open .burger span:nth-child(2){top:23px;transform:rotate(-45deg)}
@media (max-width:920px){
  .burger{display:block}
  .nav{position:fixed;inset:0;padding:calc(var(--hh) + 32px + env(safe-area-inset-top,0px)) 28px 40px;background:var(--night);color:#fff;flex-direction:column;align-items:flex-start;gap:6px;transform:translateX(100%);visibility:hidden;transition:transform .35s,visibility .35s;z-index:-1}
  .nav a{font-size:2rem;font-weight:300;padding:12px 0}
  .nav a.nav-cta{border:0;padding:12px 0}
  .nav-open .nav{transform:none;visibility:visible}
  .nav-open{color:#fff!important;background:transparent!important}
  .nav-open .logo-mark{filter:brightness(0) invert(1)}
}

/* ---------- Buttons & links ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:1em 1.8em;font:500 .95rem/1 var(--sans);letter-spacing:.04em;border:1px solid currentColor;background:transparent;color:inherit;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn-solid{background:linear-gradient(120deg,#01495c 0%,#007a8c 55%,#0194ab 100%);border-color:#007a8c;color:#fff;background-size:160% 100%;background-position:0 0;transition:background-position .5s,border-color .2s}
.btn-solid:hover{background-position:100% 0;border-color:#0194ab}
.btn-white{background:#fff;border-color:#fff;color:var(--night)}
.btn-white:hover{background:transparent;color:#fff}
.btn-ghost{color:#fff;border-color:rgba(255,255,255,.75)}
.btn-ghost:hover{background:#fff;color:var(--night);border-color:#fff}
.btn-line:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.link{color:var(--blue-text);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.28em;font-weight:400}
.link:hover{text-decoration-thickness:2px}

/* ---------- Hero ---------- */
.hero{position:relative;height:100svh;min-height:580px;margin-top:calc(-1 * env(safe-area-inset-top,0px));color:#fff;overflow:hidden;isolation:isolate;background:var(--night)}
.hero-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;will-change:opacity;transition:opacity 1.6s ease;z-index:-2}
.hero-slide.is-active{opacity:1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(2,30,40,.55) 0%,rgba(2,30,40,.3) 40%,rgba(2,30,40,0) 72%),linear-gradient(180deg,rgba(2,30,40,.6) 0%,rgba(2,30,40,.06) 32%,rgba(2,30,40,.14) 52%,rgba(2,30,40,.82) 100%)}
.hero-copy{position:absolute;left:0;right:0;bottom:clamp(44px,10vh,120px)}
.hero-copy h1{max-width:9.6em;text-shadow:0 2px 28px rgba(2,30,40,.45)}
.hero-sub{text-shadow:0 1px 18px rgba(2,30,40,.5)}
.hero-sub{font-family:var(--serif);font-size:clamp(1.15rem,1.8vw,1.5rem);line-height:1.5;max-width:36em;margin-top:clamp(18px,2.4vw,28px);opacity:.95}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:clamp(24px,3vw,38px)}
.hero-dots{position:absolute;right:calc(var(--gutter) - 4px);bottom:clamp(20px,4vh,40px);display:flex;gap:6px}
.hero-dots button{width:44px;height:36px;background:none;border:0;cursor:pointer;position:relative}
.hero-dots button::before{content:"";position:absolute;left:4px;right:4px;top:17px;height:2px;background:#fff;opacity:.4;transition:opacity .3s}
.hero-dots button[aria-current="true"]::before{opacity:1}
@media (max-width:720px){
  .hero::after{background:linear-gradient(180deg,rgba(2,30,40,.6) 0%,rgba(2,30,40,.1) 22%,rgba(2,30,40,.5) 46%,rgba(2,30,40,.9) 100%)}
  .hero-dots{right:auto;left:calc(var(--gutter) - 4px);bottom:14px}
  .hero-copy{bottom:64px}
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero-copy>*{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.hero-copy .hero-sub{animation-delay:.25s}
.hero-copy .hero-actions{animation-delay:.45s}

/* ---------- Home blocks ---------- */
.intro{display:grid;grid-template-columns:5fr 7fr;gap:clamp(32px,7vw,110px);align-items:center}
.intro-img{aspect-ratio:4/5;object-fit:cover;width:100%;background:var(--night)}
.intro h2{margin-bottom:clamp(20px,2.6vw,32px);max-width:16em}
.pull{font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,2vw,1.75rem);line-height:1.4;margin-top:clamp(28px,3.4vw,44px);max-width:24em}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(32px,4vw,56px)}
.head-row p{max-width:30em}
.metiers{border-bottom:1px solid var(--line)}
.metier{display:grid;grid-template-columns:minmax(130px,1.1fr) 2.6fr 3fr 28px;gap:clamp(16px,3vw,44px);align-items:center;padding:clamp(24px,3vw,38px) 8px;border-top:1px solid var(--line);color:inherit;text-decoration:none;transition:background .25s}
.metier:hover{background:var(--bg-alt)}
.metier-abbr{font:200 clamp(2.4rem,5vw,4.2rem)/1 var(--sans);letter-spacing:.01em}
.metier h3{font-size:1.3rem}
.metier .tagline{font-family:var(--serif);font-style:italic;color:var(--ink-2);margin-top:4px}
.metier p.desc{font-family:var(--serif);font-size:1.08rem;color:var(--ink-2);line-height:1.55}
.metier svg{width:22px;height:22px;color:var(--blue-text)}
@media (max-width:820px){
  .intro{grid-template-columns:1fr}.intro-img{aspect-ratio:16/11}
  .metier{grid-template-columns:1fr 24px;row-gap:8px}
  .metier-abbr{grid-column:1}.metier>div{grid-column:1}.metier p.desc{grid-column:1}.metier svg{grid-row:1;grid-column:2}
}

/* ---------- Tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(32px,3.4vw,52px) clamp(20px,2.4vw,36px)}
.tile{display:flex;flex-direction:column;color:inherit;text-decoration:none}
.tile-img{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--bg-alt);flex:none}
.tile-img img{width:100%;height:100%;object-fit:cover;transition:opacity .3s}
.tile:hover .tile-img img{opacity:.88}
.tile-chip{position:absolute;left:0;bottom:0;background:var(--bg);color:var(--ink);padding:.5em 1em;font:500 .82rem/1 var(--sans);letter-spacing:.1em}
.tile-text{padding-top:14px}
.tile h3{font-size:1.2rem;font-weight:400}
.tile:hover h3{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.25em}
.tile-text p{color:var(--ink-2);font-size:.95rem;margin-top:2px}
.tile.wide{grid-column:span 2}
.tile.wide .tile-img{flex:1 1 0;aspect-ratio:auto;min-height:0}
.tile.wide .tile-img img{position:absolute;inset:0}
@media (max-width:960px){.tiles{grid-template-columns:repeat(2,1fr)}.tile.wide{grid-column:span 2}.tile.wide .tile-img{flex:none;aspect-ratio:21/9}}
@media (max-width:620px){.tiles{grid-template-columns:1fr}.tile.wide{grid-column:auto}.tile.wide .tile-img{aspect-ratio:16/10}}

/* ---------- Image band ---------- */
.band-img{position:relative;color:#fff;isolation:isolate;overflow:hidden}
.band-img>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.band-img::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(2,40,52,.9) 0%,rgba(2,40,52,.66) 48%,rgba(2,40,52,.08) 100%)}
.band-img .inner{max-width:640px}
.band-img h2{margin-bottom:22px}
.band-img p{font-family:var(--serif);font-size:1.25rem;line-height:1.55;margin-bottom:32px;opacity:.96}
@media (max-width:720px){.band-img::after{background:rgba(2,40,52,.78)}}

/* ---------- Bandeau de confiance ---------- */
.trust{background:var(--night);color:#fff;padding-block:clamp(44px,6vw,80px)}
.trust .head-row{margin-bottom:clamp(28px,3.6vw,48px);align-items:center}
.trust h2{font-size:clamp(1.6rem,2.8vw,2.4rem)}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 8%,#000 92%,transparent 100%)}
.marquee-track{display:flex;width:max-content;will-change:transform}
.marquee-set{display:flex;align-items:center;gap:clamp(56px,7vw,96px);padding-right:clamp(56px,7vw,96px);margin:0;list-style:none;flex:none}
.marquee-set img{height:62px;width:auto;max-width:190px;object-fit:contain;filter:brightness(0) invert(1);opacity:.92}


/* ---------- Photovoltaïque ---------- */
.pv-stats{background:var(--bg-alt);border-bottom:1px solid var(--line)}
.pv-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(20px,3vw,32px)}
.pv-stat{padding:clamp(28px,4vw,40px) 0 0;border-top:2px solid var(--line-strong)}
.pv-stat b{display:block;font:200 clamp(2.2rem,4.4vw,3.2rem)/1 var(--sans);color:var(--blue-text);letter-spacing:-.01em}
.pv-stat>span{display:block;margin-top:12px;font-size:.98rem;color:var(--ink-2);line-height:1.45;max-width:24ch}
.pv-stat b span{font:inherit;color:inherit}
.pv-stat b{font-size:clamp(2.6rem,5vw,4rem)!important;font-weight:200}
@media (max-width:820px){.pv-stats-grid{grid-template-columns:repeat(2,1fr)}}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease var(--d,0s),transform .7s ease var(--d,0s)}
.reveal.in{opacity:1;transform:none}
.pv-tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:clamp(24px,3vw,32px)}
.pv-tab{font:400 1rem/1 var(--sans);padding:.85em 1.3em;border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.pv-tab:hover{border-color:var(--ink)}
.pv-tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pv-panel{min-height:7.5em}
.pv-panel .prose{transition:opacity .25s ease}
.pv-panel.switching .prose{opacity:0}
.timeline{position:relative;margin-top:22px}
.timeline .fill-track{position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--line)}
.timeline .fill{position:absolute;left:44px;top:0;width:2px;background:var(--blue-strong);height:0;transition:height .6s ease}
.timeline .step{position:relative;padding-left:0}
.timeline .step-n{position:relative;z-index:1;width:88px;flex:none;display:flex;align-items:center;justify-content:flex-start;transition:color .4s}
.timeline .step-n::after{content:"";position:absolute;left:40px;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--line-strong);transition:background .4s,border-color .4s,transform .4s}
.timeline .step.seen .step-n{color:var(--blue-text)}
.timeline .step.seen .step-n::after{background:var(--blue-strong);border-color:var(--blue-strong);transform:translateY(-50%) scale(1.15)}
@media (max-width:860px){.timeline .fill-track,.timeline .fill{left:26px}.timeline .step-n{width:56px}.timeline .step-n::after{left:22px}}
.article-teaser{display:grid;grid-template-columns:280px 1fr;gap:clamp(24px,3vw,40px);align-items:center;border:1px solid var(--line);padding:clamp(20px,3vw,32px);margin-top:clamp(56px,8vw,96px)}
.article-teaser img{width:100%;aspect-ratio:4/3;object-fit:cover}
.article-teaser .eyebrow{font:500 .82rem/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--blue-text);margin-bottom:10px}
.article-teaser h3{font-size:1.35rem;font-weight:400;margin-bottom:10px}
.article-teaser p{font-family:var(--serif);color:var(--ink-2);font-size:1.05rem;line-height:1.55;margin-bottom:18px}
@media (max-width:700px){.article-teaser{grid-template-columns:1fr}}


/* ---------- Photovoltaïque : défilement par sections ---------- */
.fp-sec{position:relative;padding-block:clamp(64px,9vw,112px);background:var(--bg)}
.fp-sec.alt{background:var(--bg-alt)}
.fp-inner{width:100%;flex:1;min-width:0}
.fp-kicker{display:flex;align-items:center;gap:12px;font:500 .8rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-text);margin-bottom:18px}
.fp-kicker::before{content:"";width:28px;height:1px;background:currentColor}
.fp-title{font-size:clamp(1.9rem,3.4vw,3rem);margin-bottom:clamp(22px,3.2vh,40px);max-width:18em}
.fp-hero{min-height:100svh;padding:0;color:#fff;overflow:hidden;isolation:isolate;background:var(--night)}
.fp-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.06);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.fp-hero.is-active>img,html:not(.fp-on) .fp-hero>img{transform:scale(1)}
.fp-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(2,30,40,.55) 0%,rgba(2,30,40,.25) 45%,rgba(2,30,40,0) 75%),linear-gradient(180deg,rgba(2,30,40,.55) 0%,rgba(2,30,40,.1) 35%,rgba(2,30,40,.25) 60%,rgba(2,30,40,.9) 100%)}
.fp-hero .inner{position:absolute;left:0;right:0;bottom:clamp(56px,11vh,120px)}
.fp-hero h1{max-width:13ch;text-shadow:0 2px 28px rgba(2,30,40,.45)}
.fp-hero .hero-sub{text-shadow:0 1px 18px rgba(2,30,40,.5)}
.fp-hero .pv-eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 .82rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.9;margin-bottom:18px}
.fp-hero .pv-eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.fp-hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;font:500 .72rem/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;opacity:.85;cursor:pointer;padding:8px 14px}
.fp-hint svg{width:18px;height:18px;animation:hint-bounce 1.8s ease-in-out infinite}
@keyframes hint-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
html.fp-on .fp-sec{height:100vh;min-height:0;padding:calc(var(--hh) + 20px) 0 32px;display:flex;align-items:center;overflow:hidden}
html.fp-on .fp-hero{padding:0;display:block}
html.lenis,html.lenis body{height:auto}
.lenis [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-smooth iframe{pointer-events:none}
.fp-dots{position:fixed;right:clamp(12px,1.6vw,26px);top:50%;transform:translateY(-50%);z-index:45;display:none;flex-direction:column;gap:4px;color:var(--ink);transition:color .4s}
html.fp-on .fp-dots{display:flex}
.fp-dots.on-dark{color:#fff}
.fp-dots button{position:relative;width:32px;height:26px;background:none;border:0;padding:0;cursor:pointer;color:inherit;display:grid;place-items:center}
.fp-dots button::before{content:"";width:6px;height:6px;border-radius:3px;background:currentColor;opacity:.45;transition:height .35s,opacity .35s}
.fp-dots button[aria-current="true"]::before{height:20px;opacity:1}
.fp-dots button span{position:absolute;right:36px;top:50%;transform:translate(6px,-50%);white-space:nowrap;font:500 .78rem/1 var(--sans);letter-spacing:.04em;padding:7px 10px;background:var(--night);color:#fff;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.fp-dots button:hover span,.fp-dots button:focus-visible span{opacity:1;transform:translate(0,-50%)}
.fp-count{position:fixed;left:clamp(20px,3vw,44px);bottom:26px;z-index:45;display:none;font:300 .95rem/1 var(--sans);letter-spacing:.12em;color:var(--ink);transition:color .4s}
.fp-count b{font-weight:500}
.fp-count.on-dark{color:#fff}
html.fp-on .fp-count{display:block}
.pv-grid-2{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(32px,5vw,80px);align-items:center}
.pv-grid-2 .pv-stats-grid{grid-template-columns:repeat(2,1fr);row-gap:clamp(16px,2.6vh,28px)}
.pv-chart img{max-height:46vh;width:auto;max-width:100%}
.fam{display:grid;grid-template-columns:minmax(220px,.8fr) 1.4fr;gap:clamp(28px,5vw,80px);align-items:center}
.fam-list{display:grid;gap:6px}
.fam-btn{display:flex;align-items:baseline;gap:18px;text-align:left;width:100%;padding:18px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink-2);font:300 clamp(1.2rem,1.9vw,1.6rem)/1.2 var(--sans);cursor:pointer;transition:color .25s,padding .25s}
.fam-btn small{font:500 .8rem/1 var(--sans);letter-spacing:.1em;color:var(--blue-text)}
.fam-btn:hover{color:var(--ink)}
.fam-btn[aria-selected="true"]{color:var(--ink);padding-left:14px;border-bottom-color:var(--ink)}
.fam-view{position:relative}
.fam-svg{width:100%;height:auto;max-height:40vh;display:block;color:var(--ink);transition:opacity .3s,transform .3s}
.fam-svg .panel{fill:var(--blue-strong)}
.fam-svg .cell{stroke:rgba(255,255,255,.55);stroke-width:1}

.ct{position:relative;min-height:100svh;padding:calc(var(--hh) + clamp(40px,7vh,88px)) 0 clamp(48px,8vh,96px);color:#fff;isolation:isolate;overflow:hidden;background:var(--night)}

.ct::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(100deg,rgba(2,30,40,.94) 0%,rgba(2,30,40,.82) 42%,rgba(2,30,40,.55) 100%)}

.ct-coords{list-style:none;margin:clamp(32px,5vh,56px) 0 0;padding:0;display:grid;gap:0;max-width:30em;animation:rise 1s .7s cubic-bezier(.2,.7,.2,1) both}
.ct-coords li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-top:1px solid rgba(255,255,255,.18)}

.ct-coords a{display:block;width:fit-content;text-decoration:none;font-size:1.2rem;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .35s;overflow-wrap:anywhere}

.ct-card{position:relative;background:var(--bg);color:var(--ink);padding:clamp(24px,3.4vw,44px);box-shadow:0 30px 80px rgba(0,0,0,.35);animation:ct-card 1s .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes ct-card{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.ct-progress{margin-bottom:clamp(20px,3vh,30px)}
.ct-progress p{display:flex;justify-content:space-between;font-size:.9rem;color:var(--ink-2);margin-bottom:10px}
.ct-progress p b{color:var(--ink);font-weight:500}
.ct-bar{height:2px;background:var(--line)}
.ct-bar i{display:block;height:100%;width:33.34%;background:linear-gradient(90deg,#01495c,#01b2cb);transition:width .6s cubic-bezier(.2,.7,.2,1)}
.ct-step{border:0;margin:0;padding:0;min-width:0;display:none}

@keyframes ct-in{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes ct-in-back{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.ct-q{font:300 clamp(1.5rem,2.3vw,2rem)/1.2 var(--sans);padding:0;margin-bottom:clamp(18px,2.6vh,26px)}
.ct-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ct-opt input,.ct-pills input{position:absolute;opacity:0;width:1px;height:1px}

.ct-opt label span{font-size:1rem;line-height:1.3}
.ct-opt label:hover{border-color:var(--ink);transform:translateY(-2px)}
.ct-opt input:checked+label{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ct-opt input:checked+label b{color:#7fe0ec}
.ct-opt input:focus-visible+label,.ct-pills input:focus-visible+label{outline:2px solid var(--blue);outline-offset:3px}
.ct-sub{font:500 .9rem/1 var(--sans);margin:22px 0 10px;color:var(--ink-2)}

.ct-pills label{padding:.65em 1em;border:1px solid var(--line-strong);border-radius:999px;cursor:pointer;font-size:.95rem;transition:background .2s,color .2s,border-color .2s}
.ct-pills label:hover{border-color:var(--ink)}
.ct-pills input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ct-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.ct-fields .full{grid-column:1/-1}
.fl{position:relative;padding-top:14px}
.fl input,.fl textarea{width:100%;font:400 1.08rem/1.4 var(--sans);color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line-strong);border-radius:0;padding:12px 0 10px;outline:none;transition:border-color .25s}

.fl input:focus+label,.fl input:not(:placeholder-shown)+label,.fl textarea:focus+label,.fl textarea:not(:placeholder-shown)+label{transform:translateY(-22px) scale(.8);color:var(--blue-text)}
.fl::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--blue-strong);transform:scaleX(0);transform-origin:0 50%;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.fl:focus-within::after{transform:scaleX(1)}
.fl [aria-invalid="true"]{border-bottom-color:var(--danger)}
.ct .err{display:block;min-height:1.3em;margin-top:6px}
.ct-check{display:flex;gap:12px;align-items:flex-start;font-size:.95rem;color:var(--ink-2);margin-top:18px}
.ct-check input{margin-top:.25em;width:18px;height:18px;accent-color:var(--blue-strong);flex:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ct-send-err{margin-top:14px;padding:12px 14px;border-left:3px solid var(--danger);background:rgba(179,38,30,.06);color:var(--ink);font-size:.95rem}

.ct-nav .btn[aria-busy="true"]{opacity:.7;pointer-events:none}
.ct-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:clamp(20px,3vh,30px)}
.ct-nav .btn-solid{gap:10px}
.ct-nav .btn-solid svg{width:18px;height:18px;transition:transform .25s}
.ct-nav .btn-solid:hover svg{transform:translateX(4px)}
.ct-nav [hidden]{visibility:hidden;display:inline-flex}
.ct-done{text-align:left;animation:ct-in .6s cubic-bezier(.2,.7,.2,1) both}
.ct-done svg{width:72px;height:72px;margin-bottom:18px}
.ct-done circle{fill:none;stroke:var(--blue-strong);stroke-width:2;stroke-dasharray:190;stroke-dashoffset:190;animation:ct-draw .8s .1s ease forwards}
.ct-done path{fill:none;stroke:var(--blue-strong);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:ct-draw .45s .75s ease forwards}
@keyframes ct-draw{to{stroke-dashoffset:0}}
.ct-done h2{font-size:clamp(1.7rem,3vw,2.4rem);margin-bottom:10px}
.ct-done .recap li{grid-template-columns:130px 1fr}
@media (max-width:980px){.ct-grid{grid-template-columns:1fr}.ct{padding-top:calc(var(--hh) + 36px)}}

/* ---------- Services : panneaux immersifs ---------- */
.sv{position:relative;min-height:100svh;padding:calc(var(--hh) + clamp(28px,4.5vh,56px)) 0 clamp(28px,5vh,56px);color:#fff;isolation:isolate;overflow:hidden;background:var(--night)}
.sv-bg{position:absolute;inset:0;z-index:-2}
.sv-bg img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.sv::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(2,30,40,.92) 0%,rgba(2,30,40,.86) 40%,rgba(2,30,40,.95) 100%)}
.sv::after{content:"";position:absolute;width:55vmax;height:55vmax;right:-18vmax;top:-22vmax;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(0,178,203,.28),rgba(0,178,203,0) 65%);pointer-events:none}

.sv-head{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(24px,5vw,80px);align-items:end;margin-bottom:clamp(22px,3.4vh,40px)}

.sv-panels{display:flex;gap:10px;height:clamp(480px,calc(100svh - var(--hh) - 300px),640px)}
.sv-p{position:relative;flex:1 1 0;min-width:0;overflow:hidden;isolation:isolate;contain:layout paint;cursor:pointer;background:#03303e;transition:flex-grow .75s cubic-bezier(.2,.7,.2,1);animation:rz-in .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*110ms + 250ms)}
.sv-p.is-active{flex-grow:3.3;cursor:default}
/* Photo à largeur fixe : le panneau la recadre sans la redimensionner, et plus aucun filtre recalculé */
.sv-p>img{position:absolute;top:0;left:50%;width:max(100%,1000px);max-width:none;height:100%;object-fit:cover;z-index:-3;transform:translateX(-50%) scale(1.1);transition:transform 1.3s cubic-bezier(.2,.7,.2,1);will-change:transform}

.sv-p.is-active::before{opacity:.72}

.sv-more{color:#fff;font-size:.95rem;text-decoration:none;background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;padding-bottom:2px;opacity:.9}

@media (max-width:980px){

.bx{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(18px,2vw,28px);text-decoration:none;color:inherit;contain:layout paint;animation:rz-in .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*80ms)}
.bx-arrow{position:absolute;top:clamp(16px,1.8vw,24px);right:clamp(16px,1.8vw,24px);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;opacity:.75;transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .3s,background .3s,color .3s}
.bx-arrow svg{width:18px;height:18px;transform:rotate(-45deg);transition:transform .35s}
a.bx:hover .bx-arrow{opacity:1;transform:scale(1.08)}
a.bx:hover .bx-arrow svg{transform:rotate(0)}
.bx-k{font:500 .75rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px;opacity:.85}
.bx h2,.bx h3{font-weight:300;letter-spacing:-.005em}
.bx-agence{grid-column:span 5;background:linear-gradient(135deg,#022e3d 0%,#023a4b 55%,#01495c 100%);color:#fff;justify-content:space-between}
.bx-agence .bx-k{color:#7fe0ec}
.bx-agence h2{font-size:clamp(1.8rem,2.8vw,2.6rem);line-height:1.08;margin-bottom:14px;max-width:11em}
.bx-agence p{font-family:var(--serif);font-size:clamp(1rem,1.2vw,1.12rem);line-height:1.5;opacity:.88;max-width:30em}
.bx-stats{display:flex;gap:clamp(18px,2.4vw,36px);flex-wrap:wrap;padding-top:18px;border-top:1px solid rgba(255,255,255,.16)}
.bx-stats b{display:block;font:200 clamp(1.7rem,2.4vw,2.3rem)/1 var(--sans);color:#7fe0ec;white-space:nowrap}
.bx-stats span{font-size:.82rem;opacity:.75}
.bx-link{display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:#fff;font-size:.95rem;text-decoration:none;opacity:.9}
.bx-link svg{width:16px;height:16px;transition:transform .3s}
.bx-link:hover svg{transform:translateX(4px)}
.bx-photo{color:#fff;background:var(--night)}
.bx-photo>img,.bx-slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.02);transition:transform 1.2s cubic-bezier(.2,.7,.2,1),opacity 1.2s ease;will-change:transform}
.bx-photo::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(2,30,40,.15) 0%,rgba(2,30,40,.1) 40%,rgba(2,30,40,.85) 100%)}
a.bx-photo:hover>img,a.bx-photo:hover .bx-slides img.on{transform:scale(1.07)}
.bx-slides img{opacity:0;will-change:opacity}.bx-slides img.on{opacity:1}
.bx-real{grid-column:span 4}
.bx-pv{grid-column:span 3}
.bx-photo h3{font-size:clamp(1.4rem,2vw,1.9rem);line-height:1.12}
.bx-photo p{font-size:.92rem;opacity:.85;margin-top:6px;max-width:24em}
.bx-real .bx-count{position:absolute;left:clamp(18px,2vw,28px);top:clamp(16px,1.8vw,24px);font:500 .78rem/1 var(--sans);letter-spacing:.12em;padding:.55em .8em;background:rgba(2,30,40,.55);border:1px solid rgba(255,255,255,.2)}
.bx-met{grid-column:span 2;background:var(--bg-alt);border:1px solid var(--line);justify-content:space-between;transition:border-color .3s}
.bx-met::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,#022e3d,#01495c);transform:translateY(101%);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.bx-met:hover{color:#fff;border-color:transparent}
.bx-met:hover::before{transform:none}
.bx-met .n{font:500 .75rem/1 var(--sans);letter-spacing:.14em;color:var(--blue-text);transition:color .3s}
.bx-met:hover .n{color:#7fe0ec}
.bx-met b{display:block;font:200 clamp(2rem,2.8vw,2.7rem)/1 var(--sans)}
.bx-met span{display:block;font-size:.88rem;line-height:1.3;margin-top:6px;opacity:.8}
.bx-met .bx-arrow{width:32px;height:32px;opacity:.4}
.bx-met:hover .bx-arrow{opacity:1}
.bx-ct{grid-column:span 4;background:linear-gradient(120deg,#01495c 0%,#007a8c 55%,#01a3bb 100%);color:#fff;justify-content:center;background-size:140% 100%;background-position:0 0;transition:background-position .6s}
.bx-ct:hover{background-position:100% 0}
.bx-ct h3{font-size:clamp(1.4rem,2.2vw,2rem);line-height:1.1;padding-right:56px}
.bx-photo h3,.bx-met div{padding-right:8px}
.bx-ct p{font-size:.95rem;opacity:.9;margin-top:6px}
.bento-sec+.trust{padding-block:clamp(32px,5vh,56px)}
@media (max-width:1100px){
  .bento{grid-template-rows:auto;grid-auto-rows:auto}
  .bx-agence{grid-column:1/-1}
  .bx-real,.bx-pv{grid-column:span 6;min-height:280px}
  .bx-met{grid-column:span 3;min-height:150px}
  .bx-ct{grid-column:1/-1;min-height:140px}
}
@media (max-width:620px){
  .bx-real,.bx-pv{grid-column:1/-1}
  .bx-met{grid-column:span 6;min-height:140px}
}


/* ---------- L'agence ---------- */
.ag{position:relative;min-height:100svh;padding:calc(var(--hh) + clamp(28px,4.5vh,56px)) 0 clamp(32px,5vh,60px);color:#fff;isolation:isolate;overflow:hidden;background:linear-gradient(160deg,#022e3d 0%,#02303f 55%,#013c4d 100%)}
.ag::after{content:"";position:absolute;width:60vmax;height:60vmax;left:-22vmax;bottom:-30vmax;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(0,178,203,.22),rgba(0,178,203,0) 65%);pointer-events:none}
.ag .fp-kicker{color:#7fe0ec}
.ag-top{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(32px,6vw,96px);align-items:stretch}
.ag-top .ct-title{font-size:clamp(2.4rem,4.4vw,4.2rem);margin-bottom:clamp(16px,2.4vh,26px)}
.ag-top .ct-lead{max-width:32em}
.ag-stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:clamp(20px,3vw,48px);margin:clamp(24px,4vh,40px) 0;padding-top:clamp(18px,2.6vh,26px);border-top:1px solid rgba(255,255,255,.16);animation:rise 1s .6s cubic-bezier(.2,.7,.2,1) both}
.ag-stats b{display:block;font:200 clamp(1.9rem,3vw,2.8rem)/1 var(--sans);color:#7fe0ec;white-space:nowrap}
.ag-stats span{display:block;margin-top:6px;font-size:.85rem;opacity:.75}
.ag-actions{display:flex;flex-wrap:wrap;gap:12px;animation:rise 1s .75s cubic-bezier(.2,.7,.2,1) both}
.ag-photo{position:relative;min-height:clamp(320px,52vh,560px);overflow:hidden;isolation:isolate;animation:rz-clip 1.2s .2s cubic-bezier(.7,0,.2,1) both}
.ag-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transform:scale(1.08);animation:ag-zoom 1.8s .2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes ag-zoom{to{transform:scale(1)}}
.ag-photo::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(2,30,40,0) 40%,rgba(2,30,40,.88) 100%)}
.ag-photo blockquote{position:absolute;left:0;right:0;bottom:0;margin:0;padding:clamp(18px,2.4vw,32px)}
.ag-photo blockquote p{font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,1.6vw,1.45rem);line-height:1.4;max-width:22em}
.ag-photo blockquote footer{margin-top:10px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#7fe0ec}
@media (min-width:981px) and (max-height:820px){
  .ag{padding-top:calc(var(--hh) + 22px);padding-bottom:24px}
  .ag-top .ct-title{font-size:clamp(2.1rem,3.6vw,3.2rem);margin-bottom:12px}
  .ag-top .ct-lead{font-size:1.08rem}
  .ag-stats{margin:18px 0;padding-top:14px}
  .ag-stats b{font-size:2.1rem}
  .ag-photo{min-height:0}
  .ag-values{margin-top:14px}
  .ag-v{padding:14px 18px}.ag-v h3{margin:6px 0 4px}
}
.ag-values{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:clamp(20px,3.4vh,36px)}
.ag-v{position:relative;padding:clamp(18px,2vw,26px);border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .3s,background .3s;animation:rz-in .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*90ms + 500ms)}
.ag-v:hover{transform:translateY(-4px);border-color:rgba(127,224,236,.45);background:rgba(0,178,203,.08)}
.ag-v small{font:500 .75rem/1 var(--sans);letter-spacing:.14em;color:#7fe0ec}
.ag-v h3{font:300 clamp(1.3rem,1.8vw,1.6rem)/1.2 var(--sans);margin:10px 0 6px}
.ag-v p{font-size:.95rem;line-height:1.5;opacity:.8}
.ag+.trust{border-top:1px solid rgba(255,255,255,.1)}
@media (max-width:980px){.ag-top{grid-template-columns:1fr}.ag-photo{min-height:340px}.ag-stats{grid-template-columns:repeat(2,auto)}}
@media (max-width:640px){.ag-values{grid-template-columns:1fr}}


/* ---------- Pages légales ---------- */
.legal{max-width:52em}
.legal h2{font-size:clamp(1.3rem,2vw,1.6rem);margin-top:clamp(36px,4.5vw,52px);margin-bottom:14px}
.legal h2:first-child{margin-top:0}
.legal .prose+h2{margin-top:clamp(36px,4.5vw,52px)}
.legal dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-family:var(--serif);font-size:1.08rem;margin:18px 0}
.legal dt{color:var(--ink-2)}
.legal dd{margin:0}
.legal ul{font-family:var(--serif);font-size:1.15rem;line-height:1.65;padding-left:1.2em;margin:0}
.legal ul li+li{margin-top:6px}
.legal .updated{color:var(--ink-2);font-size:.9rem;margin-top:clamp(48px,6vw,72px);padding-top:20px;border-top:1px solid var(--line)}

/* ---------- CTA + footer ---------- */
.cta-band{background:linear-gradient(115deg,#022e3d 0%,#023a4b 60%,#014a5c 100%);color:#fff}
.trust+.cta-band{border-top:1px solid rgba(255,255,255,.14)}
.cta-band .inner{display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap}
.cta-band p{font-family:var(--serif);font-size:1.25rem;opacity:.9;margin-top:12px}
.cta-actions{display:flex;flex-wrap:wrap;gap:14px}
.site-footer{background:var(--night);color:#fff;padding:clamp(48px,6vw,80px) 0 calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.14)}
.cta-band+.site-footer{border-top:1px solid rgba(255,255,255,.14)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1.4fr 1fr;gap:40px}
.foot-grid h4{font:500 .95rem/1 var(--sans);letter-spacing:.04em;margin-bottom:18px;opacity:.7}
.foot-grid ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.foot-grid a{text-decoration:none;opacity:.92}
.foot-grid a:hover{text-decoration:underline;text-underline-offset:.25em}
.foot-bottom{margin-top:56px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.9rem;opacity:.7}
@media (max-width:900px){.foot-grid{grid-template-columns:1fr 1fr}.foot-grid>:first-child{grid-column:1/-1}}

/* ---------- Inner pages ---------- */
.page{padding-top:var(--hh)}
.page-head{padding-block:clamp(56px,8vw,112px) clamp(32px,4vw,56px)}
.page-head .lead{max-width:38em;margin-top:clamp(18px,2.4vw,28px);color:var(--ink-2)}
.crumbs{font-size:.95rem;color:var(--ink-2);margin-bottom:26px}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}

/* filters */
.filters{display:grid;gap:14px;margin-bottom:clamp(28px,3.4vw,44px);padding-bottom:22px;border-bottom:1px solid var(--line)}
.filter-group{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.filter-group .lbl{font-size:.95rem;color:var(--ink-2);min-width:74px}
.chip{font:400 .95rem/1 var(--sans);padding:.7em 1.1em;border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{margin:-8px 0 26px;color:var(--ink-2)}
.empty{padding:56px 0;color:var(--ink-2);font-family:var(--serif);font-size:1.2rem}

/* project detail */
.proj-hero{position:relative;width:100%;aspect-ratio:16/9;max-height:76vh;overflow:hidden;background:var(--bg-alt)}
.proj-hero{cursor:grab;user-select:none;-webkit-user-select:none}
.proj-hero.is-single{cursor:default}
.proj-hero .ph-track{display:flex;height:100%;width:100%;will-change:transform;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.proj-hero .ph-track.is-dragging{transition:none}
.proj-hero:active{cursor:grabbing}
.proj-hero .ph-slide{flex:0 0 100%;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
.proj-hero .ph-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:clamp(40px,3.4vw,52px);height:clamp(40px,3.4vw,52px);display:grid;place-items:center;border:1px solid rgba(255,255,255,.55);background:rgba(2,30,40,.4);color:#fff;cursor:pointer;opacity:.55;transition:opacity .3s,background .3s,transform .3s;border-radius:50%}
.proj-hero:hover .ph-arrow,.proj-hero .ph-arrow:focus-visible{opacity:1}
.proj-hero .ph-arrow:hover{background:rgba(2,30,40,.72)}
.proj-hero .ph-arrow svg{width:20px;height:20px}
.proj-hero .ph-prev{left:clamp(10px,1.6vw,20px)}
.proj-hero .ph-prev svg{transform:rotate(180deg)}
.proj-hero .ph-next{right:clamp(10px,1.6vw,20px)}
.proj-hero .ph-arrow[disabled]{opacity:0!important;pointer-events:none}
@media (hover:none){.proj-hero .ph-arrow{opacity:1}}
.proj-hero .ph-count{position:absolute;right:clamp(12px,1.8vw,20px);top:clamp(12px,1.8vw,20px);z-index:3;font:600 .72rem/1 var(--wide);letter-spacing:.16em;color:#fff;background:rgba(2,30,40,.5);padding:.6em .9em}
.proj-hero .ph-scrim{position:absolute;left:0;right:0;bottom:0;height:72px;z-index:1;background:linear-gradient(180deg,rgba(2,30,40,0),rgba(2,30,40,.5));pointer-events:none}
.proj-hero .ph-dots{position:absolute;left:50%;bottom:clamp(12px,2.4vw,22px);transform:translateX(-50%);display:flex;gap:8px;z-index:2}
.proj-hero .ph-dots button{width:32px;height:24px;background:none;border:0;padding:0;cursor:pointer;position:relative}
.proj-hero .ph-dots button::before{content:"";position:absolute;left:3px;right:3px;top:11px;height:3px;background:#fff;opacity:.6;box-shadow:0 0 3px rgba(0,0,0,.5);transition:opacity .3s,transform .3s;border-radius:2px}
.proj-hero .ph-dots button[aria-current="true"]::before{opacity:1;transform:scaleY(1.3)}

.proj-body{display:grid;grid-template-columns:4fr 8fr;gap:clamp(32px,7vw,110px);padding-block:clamp(40px,5vw,72px)}
.facts{margin:0}
.facts div{padding:16px 0;border-top:1px solid var(--line)}
.facts div:last-child{border-bottom:1px solid var(--line)}
.facts dt{font-size:.92rem;color:var(--ink-2)}
.facts dd{margin:2px 0 0;font-size:1.15rem}
.proj-body h2{font-size:clamp(1.4rem,2vw,1.8rem);margin:clamp(32px,4vw,48px) 0 14px}
.pn{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:clamp(40px,5vw,64px)}
.pn a{text-decoration:none;max-width:48%}
.pn small{display:block;color:var(--ink-2);font-size:.9rem}
.pn a:hover strong{text-decoration:underline;text-underline-offset:.25em}
.pn strong{font-weight:400;font-size:1.15rem}
@media (max-width:820px){.proj-body{grid-template-columns:1fr}}

/* services */
.subnav{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.subnav .wrap{display:flex;gap:clamp(18px,3vw,40px);overflow-x:auto;scrollbar-width:none}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav a{flex:none;padding:18px 0;text-decoration:none;border-bottom:2px solid transparent;color:var(--ink-2);transition:color .2s}
.subnav a:hover{color:var(--ink)}
.subnav a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.svc{display:grid;grid-template-columns:5fr 7fr;gap:clamp(32px,7vw,110px);padding-block:clamp(56px,8vw,112px);border-bottom:1px solid var(--line)}
.svc-head{align-self:start;position:sticky;top:calc(var(--hh) + 96px)}
.svc-abbr{font:200 clamp(3.4rem,8vw,7rem)/.95 var(--sans);letter-spacing:.005em;margin-bottom:18px}
.svc-head h2{font-size:clamp(1.35rem,2vw,1.8rem);font-weight:300}
.svc-head .tagline{font-family:var(--serif);font-style:italic;font-size:1.25rem;color:var(--ink-2);margin-top:12px}
.svc h3.sub{font-size:1.05rem;font-weight:500;letter-spacing:.02em;margin:clamp(32px,4vw,48px) 0 6px}
.rules{list-style:none;margin:0;padding:0}
.rules li{padding:14px 0;border-top:1px solid var(--line);font-family:var(--serif);font-size:1.1rem;line-height:1.5}
.rules li:last-child{border-bottom:1px solid var(--line)}
.related{display:flex;flex-wrap:wrap;gap:8px}
.related a{padding:.6em 1em;border:1px solid var(--line-strong);text-decoration:none;font-size:.95rem;transition:background .2s,color .2s}
.related a:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:820px){.svc{grid-template-columns:1fr}.svc-head{position:static}}

.ombr-hero{position:relative;width:100%;aspect-ratio:21/9;overflow:hidden;background:var(--night)}
@media (max-width:720px){.ombr-hero{aspect-ratio:4/3}}
.ombr-hero img{width:100%;height:100%;object-fit:cover}
.two-col{display:grid;grid-template-columns:5fr 7fr;gap:clamp(32px,7vw,110px)}
.adv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 clamp(24px,4vw,64px)}
.adv{padding:26px 0;border-top:1px solid var(--line)}
.adv h3{font-size:1.2rem;margin-bottom:10px}
.adv ul{margin:0;padding-left:1.1em;font-family:var(--serif);font-size:1.08rem;color:var(--ink-2);line-height:1.55}
.adv li+li{margin-top:4px}
.figure{margin:0}
.figure img{width:100%;background:#fff;border:1px solid var(--line)}
.figure figcaption{font-size:.92rem;color:var(--ink-2);margin-top:10px}
.facts-list{list-style:none;margin:0;padding:0}
.facts-list li{padding:16px 0;border-top:1px solid var(--line);font-family:var(--serif);font-size:1.12rem;line-height:1.55}
.facts-list li:last-child{border-bottom:1px solid var(--line)}
.facts-list strong{font-family:var(--sans);font-weight:500}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,44px)}
.type{border-top:2px solid var(--ink);padding-top:16px}
.type h3{font-size:1.15rem;margin-bottom:8px}
.type p{font-family:var(--serif);font-size:1.05rem;color:var(--ink-2);line-height:1.55}
.phase{margin-top:clamp(36px,5vw,64px)}
.phase>h3{font-size:1.4rem;padding-bottom:14px}
.step{display:grid;grid-template-columns:90px 1fr 1.5fr;gap:clamp(16px,3vw,40px);padding:26px 0;border-top:1px solid var(--line)}
.step:last-child{border-bottom:1px solid var(--line)}
.step-n{font:200 3rem/1 var(--sans);color:var(--blue-text)}
.step h4{font-size:1.2rem;font-weight:400}
.step ul{margin:0;padding-left:1.1em;font-family:var(--serif);font-size:1.05rem;color:var(--ink-2);line-height:1.55}
.step p{font-family:var(--serif);font-size:1.05rem;color:var(--ink-2);line-height:1.55}
@media (max-width:860px){
  .two-col,.adv-grid,.types{grid-template-columns:1fr}
  .step{grid-template-columns:56px 1fr}.step>div:last-child{grid-column:2}
}

/* news */
/* ---------- Actualités ---------- */
.na-head{padding-top:calc(var(--hh) + clamp(40px,7vw,88px));padding-bottom:clamp(24px,3.4vw,40px)}
.na-head .lead{max-width:38em;margin-top:14px;color:var(--ink-2)}
.na-title{font-size:clamp(2.8rem,6vw,5.2rem);letter-spacing:.01em}
.na-title .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.2em .02em .08em;margin:-.2em -.02em -.08em}
.na-title .w>span{display:inline-block;transform:translateY(105%);animation:ct-word .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*90ms + 150ms)}
.na-bar{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.na-bar .wrap{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding-block:16px}
.na-filters{display:flex;flex-wrap:wrap;gap:10px}
.na-layout{display:grid;grid-template-columns:1fr 320px;gap:clamp(32px,6vw,88px);align-items:start;padding-block:clamp(32px,5vw,56px) clamp(64px,9vw,120px)}
.na-card{display:grid;grid-template-columns:260px 1fr;gap:clamp(20px,3vw,36px);padding:clamp(26px,3.4vw,38px) 0;border-top:1px solid var(--line);animation:rz-in .7s cubic-bezier(.2,.7,.2,1) both}
.na-feed .na-card:last-child{border-bottom:1px solid var(--line)}
.na-thumb{aspect-ratio:4/3;object-fit:cover;width:100%;background:var(--bg-alt)}
.na-thumb.ph{display:grid;place-items:center}
.badge{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:500}
.in-badge{display:inline-grid;place-items:center;width:20px;height:20px;background:#0a66c2;color:#fff;font:700 .68rem/1 Arial,sans-serif;border-radius:3px}
.site-badge{width:20px;height:20px}
.na-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;font-size:.85rem;color:var(--ink-2);margin-bottom:10px}
.na-date{position:relative;padding-left:16px}
.na-date::before{content:"";position:absolute;left:0;top:50%;width:4px;height:4px;border-radius:50%;background:var(--line-strong);transform:translateY(-50%)}
.na-card h3{font-size:clamp(1.5rem,2vw,1.9rem);line-height:1.02;margin-bottom:10px}
.na-card p{font-family:var(--serif);font-size:1.08rem;line-height:1.55;color:var(--ink-2);margin-bottom:16px}
.na-side{position:sticky;top:calc(var(--hh) + 28px)}
.na-promo{background:linear-gradient(120deg,#01495c 0%,#007a8c 60%,#01a3bb 100%);color:#fff;padding:clamp(24px,3vw,32px)}
.na-promo h3{font-size:1.5rem;margin-bottom:10px}
.na-promo p{font-family:var(--serif);font-size:1.02rem;line-height:1.5;opacity:.92;margin-bottom:18px}
@media (max-width:980px){.na-layout{grid-template-columns:1fr}.na-side{position:static}}
@media (max-width:700px){.na-card{grid-template-columns:1fr}}

/* forms */
.contact-layout{display:grid;grid-template-columns:7fr 4fr;gap:clamp(32px,7vw,110px);align-items:start}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 24px}
.field{display:grid;gap:7px;align-content:start}
.field.full{grid-column:1/-1}
.field>label,.field>legend,fieldset.field legend{font:500 .95rem/1.3 var(--sans);padding:0}
fieldset.field{border:0;margin:0;padding:0;min-width:0}
.req{color:var(--ink-2);font-weight:400}
.input,.select,.textarea{font:400 1rem/1.4 var(--sans);width:100%;padding:.9em 1em;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);border-radius:0}
.textarea{min-height:150px;resize:vertical}
.input:hover,.select:hover,.textarea:hover{border-color:var(--ink)}
.input[aria-invalid="true"],.select[aria-invalid="true"],.textarea[aria-invalid="true"]{border-color:var(--danger)}
.err{color:var(--danger);font-size:.9rem;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;position:relative}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips label{padding:.75em 1.1em;border:1px solid var(--line-strong);cursor:pointer;font-size:.98rem;transition:background .2s,color .2s,border-color .2s}
.chips label:hover{border-color:var(--ink)}
.chips input:checked+label{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips input:focus-visible+label{outline:2px solid var(--blue);outline-offset:3px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.95rem;color:var(--ink-2)}
.check input{margin-top:.3em;width:18px;height:18px;accent-color:var(--blue-strong)}
.coords{border-top:1px solid var(--line)}
.coords>div{padding:20px 0;border-bottom:1px solid var(--line)}
.coords h3{font-size:.95rem;font-weight:500;color:var(--ink-2);margin-bottom:6px;letter-spacing:.02em}
.coords a{text-decoration:none;font-size:1.25rem;display:block}
.coords a:hover{text-decoration:underline;text-underline-offset:.25em}
.done{border:1px solid var(--line-strong);padding:clamp(24px,4vw,48px)}
.done h2{font-size:clamp(1.6rem,3vw,2.4rem);margin-bottom:14px}
.recap{margin:26px 0 30px;padding:0;list-style:none}
.recap li{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:170px 1fr;gap:16px}
.recap li span:first-child{color:var(--ink-2)}
@media (max-width:900px){.contact-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}

/* dialog, toast, notes */
dialog{border:0;padding:0;max-width:min(760px,calc(100vw - 32px));width:100%;max-height:calc(100dvh - 48px);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(2,30,40,.66)}
.dlg{padding:clamp(22px,4vw,44px)}
.dlg-x{position:absolute;right:8px;top:8px;width:44px;height:44px;background:var(--bg);border:0;color:var(--ink);font-size:1.6rem;cursor:pointer;line-height:1}
.dlg img{width:100%;aspect-ratio:16/9;object-fit:cover;margin:18px 0 22px}
.post-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;font-size:.9rem;color:var(--ink-2)}
.post-meta .na-date{position:relative;padding-left:16px}
.post-meta .na-date::before{content:"";position:absolute;left:0;top:50%;width:4px;height:4px;border-radius:50%;background:var(--line-strong);transform:translateY(-50%)}
.dlg h2{font-size:clamp(1.5rem,3vw,2.1rem);margin-top:10px;padding-right:36px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);background:var(--ink);color:var(--bg);padding:14px 22px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:90;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- Photovoltaïque allégée ---------- */
.law{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,80px);margin-top:clamp(10px,2vh,24px)}
.law-fig{border-top:2px solid var(--ink);padding-top:clamp(16px,2.6vh,28px)}
.law-fig b{display:block;font:400 clamp(4.4rem,11vw,9.5rem)/.9 var(--display);color:var(--blue-text);letter-spacing:.01em}
.law-fig span{display:block;margin-top:14px;font-family:var(--serif);font-size:clamp(1.1rem,1.5vw,1.35rem);line-height:1.45;max-width:22em}
.law-note{margin-top:clamp(20px,4vh,40px);font-size:.9rem;color:var(--ink-2)}
.pv-stats-grid.four{grid-template-columns:repeat(4,1fr);margin-top:clamp(10px,2vh,20px)}
.pv-stats-grid.four .pv-stat b{font-size:clamp(3.6rem,7vw,6.2rem)!important}
.adv4{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(18px,3vw,44px);margin-top:clamp(10px,2vh,24px)}
.adv4>div{border-top:1px solid var(--line-strong);padding-top:clamp(16px,2.4vh,24px)}
.adv4 small{font:600 .72rem/1 var(--wide);letter-spacing:.22em;color:var(--blue-text)}
.adv4 h3{font:400 clamp(1.8rem,2.6vw,2.4rem)/1 var(--display);margin:12px 0 10px;letter-spacing:.01em}
.adv4 p{font-family:var(--serif);font-size:1.08rem;line-height:1.5;color:var(--ink-2)}
.mt-row{display:grid;grid-template-columns:140px 1fr;gap:clamp(16px,3vw,40px);align-items:start;padding-block:clamp(14px,2.6vh,26px);border-top:1px solid var(--line-strong)}
.mt-row:last-child{border-bottom:1px solid var(--line-strong)}
.mt-ph{font:600 .75rem/1 var(--wide);letter-spacing:.22em;text-transform:uppercase;color:var(--blue-text);padding-top:.9em}
.mt{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2.4vw,36px)}
.mt li{display:flex;align-items:baseline;gap:14px}
.mt b{font:400 clamp(2.8rem,4.6vw,4rem)/.9 var(--display);color:var(--blue-text);min-width:.6em}
.mt span{font-size:clamp(1rem,1.3vw,1.15rem);line-height:1.35}
@media (max-width:900px){.law,.adv4,.pv-stats-grid.four{grid-template-columns:1fr 1fr}.mt-row{grid-template-columns:1fr}.mt{grid-template-columns:1fr}}
@media (max-width:560px){.law,.adv4{grid-template-columns:1fr}}


/* ---------- Photovoltaïque : mode présentation (les sections apparaissent sur place) ---------- */
.fp-sec.fp-end{padding:0;background:var(--night);color:#fff}
.fp-end .trust{background:transparent}
.fp-endfoot,.fp-legal{display:none}
html.fp-on,html.fp-on body{overflow:hidden;height:100%}
html.fp-on body[data-page="photovoltaique"] #footer{display:none}
html.fp-on .fp{position:fixed;inset:0;z-index:1;overflow:hidden;background:var(--bg)}
html.fp-on .fp-sec{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s ease-out,visibility 0s linear .4s}
html.fp-on .fp-sec.is-leaving{opacity:1;visibility:visible;z-index:1;transition:none}
html.fp-on .fp-sec.is-active{opacity:1;visibility:visible;pointer-events:auto;z-index:2;transition:opacity .4s ease-out,visibility 0s}
/* 1) l'ancien contenu s'efface vite  2) le fond change  3) le nouveau texte apparaît en fondu lent */
html.fp-on .fp-sec .reveal{opacity:0;transform:translateY(calc(var(--dir,1) * 26px));transition:opacity .18s ease,transform .18s ease;will-change:opacity,transform}
html.fp-on .fp-sec.is-leaving .reveal{transform:translateY(calc(var(--dir,1) * -18px))}
html.fp-on .fp-sec.is-active .reveal{opacity:1;transform:none;transition:opacity 1s ease calc(.2s + var(--d,0s)),transform 1.1s cubic-bezier(.2,.7,.2,1) calc(.2s + var(--d,0s))}
html.fp-on .fp-sec.fp-end{display:flex;flex-direction:column;justify-content:center}
html.fp-on .fp-end .fp-inner{flex:0 0 auto;width:100%}
html.fp-on .fp-end .trust{padding-block:0 clamp(24px,4vh,44px)}
html.fp-on .fp-endfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;padding-block:clamp(20px,3.4vh,32px);border-top:1px solid rgba(255,255,255,.16)}
html.fp-on .fp-legal{display:block;font-size:.85rem;opacity:.6}
.fp-endcoords{display:flex;flex-wrap:wrap;gap:10px 30px}
.fp-endcoords a{color:#fff;text-decoration:none;font-size:1.1rem;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .3s}
.fp-endcoords a:hover{background-size:100% 1px}


/* ---------- Titres du mode présentation : mots qui montent (comme sur les autres pages) ---------- */
.wt .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.2em .02em .08em;margin:-.2em -.02em -.08em}
.wt .w>span{display:inline-block}
html.fp-on .wt .w>span{transform:translateY(125%)}
html.fp-on .fp-sec.is-active .wt .w>span{animation:ct-word .95s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.12s + var(--i)*80ms)}
html.fp-on .fp-sec.is-leaving .wt .w>span{animation:fp-word-out .3s cubic-bezier(.55,0,.8,.3) both}
@keyframes fp-word-out{from{transform:none}to{transform:translateY(-125%)}}


/* ---------- Chantiers en cours ---------- */
.is-wip>img{filter:blur(10px);transform:scale(1.12)}
.is-wip .ph-slide{filter:blur(10px);transform:scale(1.06)}

.wip-veil{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgba(2,30,40,.34);pointer-events:none}
.wip-veil>span{font:600 .78rem/1 var(--wide);letter-spacing:.24em;text-transform:uppercase;color:#fff;padding:.85em 1.3em;border:1px solid rgba(255,255,255,.65);background:rgba(2,30,40,.4)}
.proj-hero .wip-veil>span{font-size:1rem;padding:1em 1.8em}
.tile-chip.wip-chip{left:auto;right:0;background:var(--blue-strong);color:#fff}

/* ---------- Contact sans défilement ---------- */
body[data-page="contact"] #footer{display:none}
@media (min-width:981px){
  .ct{height:100svh;min-height:560px;padding:calc(var(--hh) + clamp(14px,3vh,36px)) 0 clamp(14px,3vh,36px);display:flex;align-items:center}
  .ct>.wrap{width:100%}
  .ct-title{font-size:clamp(3rem,6vw,5.6rem)!important;margin-bottom:clamp(10px,2vh,22px)!important}
  .ct-lead{font-size:clamp(1.02rem,1.3vw,1.22rem)}
  .ct-coords{margin-top:clamp(16px,3vh,36px)}
  .ct-coords li{padding:clamp(9px,1.6vh,15px) 0}
  .ct-card{max-height:calc(100svh - var(--hh) - clamp(28px,6vh,72px));overflow:auto;overscroll-behavior:contain;padding:clamp(20px,3vh,36px) clamp(22px,2.6vw,38px)}
  .ct-progress{margin-bottom:clamp(12px,2.2vh,24px)}
  .ct-q{margin-bottom:clamp(12px,2vh,20px)!important}
  .ct-opt label{padding:clamp(8px,1.3vh,13px) 14px;gap:4px}
  .ct-sub{margin:clamp(12px,2vh,20px) 0 8px}
  .ct-pills label{padding:.5em .9em}
  .ct-fields .fl{padding-top:10px}
  .fl textarea{min-height:clamp(90px,16vh,150px)}
  .ct-nav{margin-top:clamp(12px,2.2vh,26px)}
  .ct-done svg{width:56px;height:56px;margin-bottom:10px}
  .ct-done .recap{margin:14px 0 18px}.ct-done .recap li{padding:6px 0}
}
/* ---------- Typographie : titres condensés (Bebas Neue) + surtitres espacés (Montserrat) ---------- */
h1,h2,.display,.page-title,.ct-title,.fp-title,.rz-top h1,.bx h2,.bx h3,.sv-abbr,.metier-abbr,.svc-abbr,.ct-q,.done h2,.ct-done h2,.dlg h2,.fam-btn,.ag-v h3,.head-row h2,.pv-stat b,.rz-stats b,.bx-stats b,.ag-stats b,.bx-met b,.step-n,.post h3,.article-teaser h3{
  font-family:var(--display)!important;font-weight:400!important;letter-spacing:.012em;line-height:.98}
h1.display{font-size:clamp(3rem,7.4vw,6.8rem)}
.ct-title,.sv-head .ct-title,.ag-top .ct-title{letter-spacing:.01em;line-height:.95}
.fp-title{font-size:clamp(2.2rem,4vw,3.6rem)}
.rz-top h1{font-size:clamp(3.6rem,10vw,9rem);line-height:.9}
.pv-stat b,.rz-stats b,.bx-stats b,.ag-stats b{letter-spacing:.02em}
.sv-abbr,.bx-met b{font-size:clamp(2.8rem,4.4vw,4.2rem)}
.ct-q{font-size:clamp(1.8rem,2.8vw,2.4rem)}
.fam-btn{font-size:clamp(1.5rem,2.2vw,2rem)}
.ag-v h3{font-size:clamp(1.6rem,2.2vw,2rem)}
.post h3,.article-teaser h3{font-size:clamp(1.5rem,2vw,1.9rem);line-height:1.02}
.fp-kicker,.bx-k,.pv-eyebrow,.sv-n,.ag-v small,.ptile-cat,.rz-filters .lbl,.bx-count,.ct-coords span,.tile-chip,.eyebrow{font-family:var(--wide)!important;font-weight:600!important;letter-spacing:.22em!important}

const PHOTOS_SRC='';
let photosPending = !!PHOTOS_SRC && PHOTOS_SRC!=='__PHOTOS_'+'SRC__';
function ensurePhotos(cb){
  if(!photosPending) return cb&&cb();
  if(window.__PHOTOS){ Object.assign(IMG,window.__PHOTOS); photosPending=false; return cb&&cb(); }
  if(ensurePhotos._waiting){ ensurePhotos._waiting.push(cb); return; }
  ensurePhotos._waiting=[cb];
  const sc=document.createElement('script'); sc.src=PHOTOS_SRC;
  sc.onload=sc.onerror=()=>{ Object.assign(IMG,window.__PHOTOS||{}); photosPending=false; ensurePhotos._waiting.forEach(f=>f&&f()); ensurePhotos._waiting=null; };
  document.head.appendChild(sc);
}
const _src={};
function imgSrc(k){
  if(_src[k]) return _src[k];
  const d=IMG[k]; if(!d) return '';
  if(!d.startsWith('data:')) return _src[k]=d;
  try{
    const c=d.indexOf(','), mime=d.slice(5,d.indexOf(';')), bin=atob(d.slice(c+1)), u=new Uint8Array(bin.length);
    for(let j=0;j<bin.length;j++) u[j]=bin.charCodeAt(j);
    return _src[k]=URL.createObjectURL(new Blob([u],{type:mime}));
  }catch(e){ return _src[k]=d; }
}

function mountProjectGallery(){
  const wrap=$('#proj-hero'), track=$('#ph-track'); if(!wrap||!track) return;
  const slides=$$('.ph-slide',track), dots=$$('.ph-dots button',wrap), arrows=$$('.ph-arrow',wrap), counter=$('#ph-count');
  if(slides.length<2){ wrap.classList.add('is-single'); return; }
  let idx=0, startX=null, startY=null, dx=0, dragging=false, w=()=>wrap.getBoundingClientRect().width;
  const render=()=>{
    track.style.transform=`translate3d(${-idx*100}%,0,0)`;
    dots.forEach((d,k)=>d.setAttribute('aria-current',String(k===idx)));
    if(counter) counter.textContent=`${idx+1} / ${slides.length}`;
    arrows.forEach(a=>a.toggleAttribute('disabled', (+a.dataset.dir<0 && idx===0) || (+a.dataset.dir>0 && idx===slides.length-1)));
  };
  const go=i=>{ idx=Math.max(0,Math.min(slides.length-1,i)); track.classList.remove('is-dragging'); render(); };
  dots.forEach((d,i)=>d.addEventListener('click',()=>go(i)));
  arrows.forEach(a=>a.addEventListener('click',()=>go(idx+ +a.dataset.dir)));
  wrap.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'){e.preventDefault();go(idx+1);} if(e.key==='ArrowLeft'){e.preventDefault();go(idx-1);} });
  const down=(x,y)=>{ startX=x; startY=y; dx=0; dragging=false; };
  const move=(x,y,e)=>{
    if(startX===null) return;
    const mx=x-startX, my=y-startY;
    if(!dragging){ if(Math.abs(mx)<6 || Math.abs(mx)<Math.abs(my)) return; dragging=true; track.classList.add('is-dragging'); }
    if(e&&e.cancelable) e.preventDefault();
    dx=mx;
    if((idx===0&&dx>0)||(idx===slides.length-1&&dx<0)) dx*=.35;          // résistance en butée
    track.style.transform=`translate3d(calc(${-idx*100}% + ${dx}px),0,0)`;
  };
  const up=()=>{
    if(startX===null) return;
    const moved=dragging, d=dx; startX=startY=null; dx=0;
    track.classList.remove('is-dragging');
    if(moved && Math.abs(d)>Math.min(90,w()*.12)) go(idx+(d<0?1:-1)); else render();
  };
  // la piste glisse hors cadre : on écoute sur la fenêtre du carrousel, pas sur la piste
  const onBtn=e=>e.target.closest&&e.target.closest('button');
  const onDown=e=>{ if(onBtn(e)) return; e.preventDefault(); down(e.clientX,e.clientY); };
  const onMove=e=>move(e.clientX,e.clientY);
  wrap.addEventListener('mousedown',onDown);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',up);
  wrap.addEventListener('touchstart',e=>{ if(onBtn(e)) return; down(e.touches[0].clientX,e.touches[0].clientY); },{passive:true});
  wrap.addEventListener('touchmove',e=>move(e.touches[0].clientX,e.touches[0].clientY,e),{passive:false});
  wrap.addEventListener('touchend',up,{passive:true});
  wrap.addEventListener('dragstart',e=>e.preventDefault());
  state.cleanups.push(()=>{ window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',up); });
  render();
}

function goSlide(n){
  const slides=$$('.hero-slide'), dots=$$('.hero-dots button'); if(!slides.length) return;
  slides.forEach(im=>{ if(im.dataset.src && !im.getAttribute('src')) im.src=imgSrc(im.dataset.src); });
  state.slide=n%slides.length;
  slides.forEach((s,i)=>s.classList.toggle('is-active',i===state.slide));
  dots.forEach((d,i)=>d.setAttribute('aria-current',String(i===state.slide)));
}
function mountHero(){
  clearInterval(state.timer);
  const lazy=$$('.hero-slide[data-src]');
  if(lazy.length){ const load=()=>lazy.forEach(im=>{ if(!im.getAttribute('src')) im.src=imgSrc(im.dataset.src); });
    const t=setTimeout(()=>('requestIdleCallback' in window)?requestIdleCallback(load,{timeout:2500}):load(),1200); state.cleanups.push(()=>clearTimeout(t)); }
  $$('.hero-dots button').forEach(b=>b.addEventListener('click',()=>{goSlide(+b.dataset.slide);clearInterval(state.timer);}));
  if(!reduceMotion) state.timer=setInterval(()=>{ if(!document.hidden) goSlide(state.slide+1); },7000);
}
function mountHomeSlides(){
  const imgs=$$('.bx-slides img'); if(imgs.length<2) return;
  let i=0;
  const id=setInterval(()=>{ if(document.hidden) return; imgs[i].classList.remove('on'); i=(i+1)%imgs.length; imgs[i].classList.add('on'); },3800);
  state.cleanups.push(()=>clearInterval(id));
}
function mountTrust(){
  const track=$('#marquee-track'); if(!track) return;
  const base=$('#marquee-base',track);
  if(state.marqueeCleanup){state.marqueeCleanup();state.marqueeCleanup=null;}
  let anim=null, lastW=0, lastVp=0;
  const build=()=>{
    const w=base.getBoundingClientRect().width, vp=track.parentElement.clientWidth;
    if(w<50 || (Math.abs(w-lastW)<1 && vp===lastVp && anim)) return;
    lastW=w; lastVp=vp;
    $$('.marquee-set[data-clone]',track).forEach(n=>n.remove());
    const need=Math.max(2,Math.ceil(vp/w)+2);
    for(let i=1;i<need;i++){
      const c=base.cloneNode(true); c.removeAttribute('id'); c.setAttribute('data-clone','true'); c.setAttribute('aria-hidden','true');
      $$('img',c).forEach(im=>im.alt=''); track.appendChild(c);
    }
    const progress = anim ? (anim.currentTime % anim.effect.getTiming().duration) / anim.effect.getTiming().duration : 0;
    if(anim) anim.cancel();
    const duration=Math.max(18000, w/55*1000);
    anim=track.animate([{transform:'translateX(0)'},{transform:`translateX(${-w}px)`}],{duration,iterations:Infinity,easing:'linear'});
    anim.currentTime=progress*duration;
  };
  const imgs=$$('img',base);
  Promise.all(imgs.map(im=>im.complete&&im.naturalWidth?Promise.resolve():(im.decode?im.decode().catch(()=>{}):Promise.resolve()))).then(()=>requestAnimationFrame(build));
  requestAnimationFrame(build);
  const ro=new ResizeObserver(()=>build()); ro.observe(base); ro.observe(track.parentElement);
  state.marqueeCleanup=()=>{ro.disconnect(); if(anim) anim.cancel();};
}
function mountReveal(){
  const els=$$('.reveal');
  if(reduceMotion){ els.forEach(e=>e.classList.add('in')); return; }
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{threshold:.15,rootMargin:'0px 0px -8% 0px'});
  els.forEach(e=>io.observe(e));
  state.pvIO.push(io);
}
function countUp(el){

  if(state.marqueeCleanup){state.marqueeCleanup();state.marqueeCleanup=null;}
  if(state.fpCleanup){state.fpCleanup();state.fpCleanup=null;}
  state.cleanups.forEach(f=>f()); state.cleanups=[];
  document.body.dataset.page=state.route.page;
  $('#main').innerHTML=out.html;
  document.title=out.title;
  $$('#nav a').forEach(a=>{ if(a.dataset.nav===state.route.page) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#header').classList.remove('nav-open'); resumeLenis(); $('#burger').setAttribute('aria-expanded','false'); $('#burger').setAttribute('aria-label','Ouvrir le menu');
  out.mount&&out.mount();
  updateHeader();
  const target = null;
  if(target){ requestAnimationFrame(()=>scrollToY(target,{immediate:true})); }
  else { scrollToY(0,{immediate:true}); }
  if(force!==true && !target) $('#main').focus({preventScroll:true});
}

/* ================= Init ================= */
$('#logo-mark').src=imgSrc('icon');
renderFooter();
// Prépare les photos par petits lots quand le navigateur est inactif : les changements de page
// n'ont plus à les reconstituer au dernier moment.
function warmImages(){
  const keys=Object.keys(IMG).filter(k=>!_src[k]);
  if(!keys.length) return;
  const idle = window.requestIdleCallback || (f=>setTimeout(()=>f({timeRemaining:()=>8}),120));
  const step=deadline=>{
    let n=0;
    while(keys.length && n<4 && (deadline.timeRemaining?deadline.timeRemaining()>3:n<2)){ imgSrc(keys.shift()); n++; }
    if(keys.length) idle(step,{timeout:800});
  };
  idle(step,{timeout:1200});
}
setTimeout(()=>{ warmImages(); setTimeout(()=>ensurePhotos(),1500); },900);
initLenis();
$('#post-dialog').addEventListener('close',resumeLenis);
window.addEventListener('hashchange',()=>route());
window.addEventListener('scroll',updateHeader,{passive:true});
window.addEventListener('resize',updateHeader);
$('#burger').addEventListener('click',()=>{
  const h=$('#header'); const open=!h.classList.contains('nav-open'); h.classList.toggle('nav-open',open);
  $('#burger').setAttribute('aria-expanded',String(open)); $('#burger').setAttribute('aria-label',open?'Fermer le menu':'Ouvrir le menu');
  if(open){ h.classList.remove('over-hero'); pauseLenis(); } else { updateHeader(); resumeLenis(); }
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-toast]'); if(t){e.preventDefault();toast(t.dataset.toast);return;}
  const p=e.target.closest('[data-post]'); if(p){openPost(p.dataset.post);return;}
  if(e.target.closest('.dlg-x')||e.target.closest('[data-close]')){ $('#post-dialog').close(); return; }
  if(e.target===$('#post-dialog')) $('#post-dialog').close();
});
try{ if(!location.hash) history.replaceState(null,'',location.pathname+location.search+'#/'); }catch(e){}
route(true);
</script>
